name: Build Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with: { python-version: '3.11' }
    - run: pip install -r requirements.txt pyinstaller
    - run: python -m PyInstaller --name="iCloud照片迁移助手" --windowed --onedir --noconfirm --clean --add-data="core:core" --add-data="gui:gui" --add-data="README.md:." --add-data="config.yaml.example:." --icon=icon.png --hidden-import=PySide6 --hidden-import=qrcode --hidden-import=PIL --hidden-import=yaml --hidden-import=sqlite3 main.py
    - run: hdiutil create -volname "iCloud照片迁移助手" -srcfolder "dist/iCloud照片迁移助手.app" -ov -format UDZO "dist/iCloud照片迁移助手-macOS.dmg"
    - run: cd dist && ditto -c -k --sequesterRsrc --keepParent "iCloud照片迁移助手.app" "iCloud照片迁移助手-macOS.zip"
    - uses: actions/upload-artifact@v4
      with: { name: macos-build, path: dist/*macOS* }
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with: { python-version: '3.11' }
    - run: pip install -r requirements.txt pyinstaller
    - run: python -m PyInstaller --name="iCloud照片迁移助手" --windowed --onedir --noconfirm --clean --add-data="core;core" --add-data="gui;gui" --add-data="README.md;." --add-data="config.yaml.example;." --icon=icon.png --hidden-import=PySide6 --hidden-import=qrcode --hidden-import=PIL --hidden-import=yaml --hidden-import=sqlite3 main.py
    - run: Compress-Archive -Path "dist\iCloud照片迁移助手" -DestinationPath "dist\iCloud照片迁移助手-Windows.zip"
    - uses: actions/upload-artifact@v4
      with: { name: windows-build, path: dist/*Windows* }
  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions: { contents: write }
    steps:
    - uses: actions/download-artifact@v4
    - uses: softprops/action-gh-release@v1
      with:
        files: ./macos-build/* ./windows-build/*
